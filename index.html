<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键振邦</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="stage">
        <button id="zhenbangBtn" class="btn" type="button">一键振邦</button>
        <button id="tipsBtn" class="btn" type="button">获取Tips</button>
    </main>

    <!-- 弹窗 -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
            <div class="modal-actions">
                <button id="nextTipBtn" class="btn" style="display:none; padding: 10px 20px; font-size: 16px;">再来一条</button>
                <button id="closeBtn" class="btn" style="padding: 10px 20px; font-size: 16px;">关闭</button>
            </div>
        </div>
    </div>

    <!-- 你被骗了时播放的音乐 -->
    <audio id="trickAudio" src="trick.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
