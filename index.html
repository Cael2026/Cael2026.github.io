<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="creative-medium" content="interactive-prototype" />
  <title>振邦团队官方频道</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --brand-red: #E30010;
      --brand-red-dark: #B8000C;
      --brand-red-light: #FF2A3B;
      --brand-red-glow: rgba(227, 0, 16, 0.4);
      --bg-black: #000000;
      --bg-elev-1: #0D0D0D;
      --bg-elev-2: #141414;
      --bg-elev-3: #1A1A1A;
      --border-soft: rgba(255, 255, 255, 0.08);
      --border-mid: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.2);
      --text-primary: #F2F2F2;
      --text-secondary: #B3B3B3;
      --text-tertiary: #7A7A7A;
      --text-muted: #555555;
      --max-w: 1200px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-weight: 400;
      color: var(--text-primary);
      background: var(--bg-black);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    a {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    ul { list-style: none; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 32px;
    }

    /* ===== Nav ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid transparent;
      transition: all 0.3s var(--ease-out);
    }
    .nav.scrolled {
      border-bottom-color: var(--border-soft);
      background: rgba(0, 0, 0, 0.75);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .nav-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .nav-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .nav-brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .nav-brand-sub {
      font-size: 11px;
      color: var(--text-tertiary);
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-link {
      position: relative;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 6px;
      transition: color 0.2s var(--ease-out), background 0.2s var(--ease-out);
    }
    .nav-link:hover {
      color: var(--brand-red-light);
      background: rgba(227, 0, 16, 0.1);
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 20px;
      height: 2px;
      background: var(--brand-red);
      border-radius: 1px;
      transition: transform 0.3s var(--ease-out);
    }
    .nav-link:hover::after {
      transform: translateX(-50%) scaleX(1);
    }
    .nav-cta {
      padding: 10px 22px;
      background: var(--brand-red);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      transition: all 0.25s var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    .nav-cta:hover {
      background: var(--brand-red-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px var(--brand-red-glow);
    }
    .nav-cta:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px var(--brand-red-glow);
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 72px;
      overflow: hidden;
      background: var(--bg-black);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .hero-curve {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      opacity: 0.15;
      filter: blur(100px);
    }
    .hero-curve-1 {
      top: -200px;
      right: -150px;
      background: var(--brand-red);
    }
    .hero-curve-2 {
      bottom: -250px;
      left: -100px;
      background: var(--brand-red);
      opacity: 0.1;
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 80px;
      align-items: center;
      width: 100%;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(227, 0, 16, 0.12);
      border: 1px solid rgba(227, 0, 16, 0.25);
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      color: var(--brand-red-light);
      margin-bottom: 28px;
    }
    .hero-eyebrow-dot {
      width: 6px;
      height: 6px;
      background: var(--brand-red-light);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }
    .hero-title {
      font-size: 64px;
      font-weight: 900;
      line-height: 1.25;
      color: var(--text-primary);
      letter-spacing: -1px;
      margin-bottom: 28px;
    }
    .hero-title .slogan-line {
      display: inline-block;
      white-space: nowrap;
    }
    .hero-title .red {
      color: var(--brand-red-light);
    }
    .hero-title .sep {
      color: var(--text-tertiary);
      font-weight: 300;
      margin: 0 0.3em;
    }
    .hero-desc {
      font-size: 17px;
      line-height: 1.85;
      color: var(--text-secondary);
      margin-bottom: 40px;
      max-width: 540px;
    }
    .hero-actions {
      display: flex;
      gap: 16px;
      margin-bottom: 60px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s var(--ease-out);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--brand-red);
      color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(227, 0, 16, 0.25);
    }
    .btn-primary:hover {
      background: var(--brand-red-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--brand-red-glow);
    }
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(227, 0, 16, 0.2);
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1.5px solid var(--border-mid);
    }
    .btn-secondary:hover {
      border-color: var(--brand-red);
      color: var(--brand-red-light);
      transform: translateY(-2px);
      background: rgba(227, 0, 16, 0.06);
    }
    .btn-secondary:active {
      transform: translateY(0);
    }
    .btn-icon {
      width: 18px;
      height: 18px;
      transition: transform 0.3s var(--ease-out);
    }
    .btn:hover .btn-icon {
      transform: translateX(3px);
    }
    .hero-stats {
      display: flex;
      gap: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border-soft);
    }
    .hero-stat {
      display: flex;
      flex-direction: column;
    }
    .hero-stat-num {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 6px;
    }
    .hero-stat-label {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .hero-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-logo-wrap {
      position: relative;
      width: 380px;
      height: 380px;
    }
    .hero-logo-ring {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      border: 1px solid rgba(227, 0, 16, 0.2);
      animation: ring-rotate 20s linear infinite;
    }
    .hero-logo-ring::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 8px;
      background: var(--brand-red-light);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--brand-red-light);
    }
    .hero-logo-ring-2 {
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      border: 1px dashed rgba(227, 0, 16, 0.12);
      animation: ring-rotate 30s linear infinite reverse;
    }
    @keyframes ring-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hero-logo-main {
      position: absolute;
      inset: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-logo-main img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 60px rgba(227, 0, 16, 0.45));
      animation: logo-float 6s ease-in-out infinite;
    }
    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* ===== Section Common ===== */
    .section {
      padding: 120px 0;
      position: relative;
    }
    .section-header {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 64px;
    }
    .section-tag {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-red-light);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }
    .section-desc {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* ===== About ===== */
    .about {
      background: var(--bg-elev-1);
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
    }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }
    .about-visual {
      position: relative;
    }
    .about-card-main {
      position: relative;
      aspect-ratio: 4/5;
      background: linear-gradient(145deg, #1a0507 0%, #000000 100%);
      border: 1px solid rgba(227, 0, 16, 0.2);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .about-card-main img {
      width: 55%;
      opacity: 0.95;
      filter: drop-shadow(0 10px 30px rgba(227, 0, 16, 0.5));
    }
    .about-card-float {
      position: absolute;
      bottom: -24px;
      right: -24px;
      background: var(--bg-elev-3);
      border: 1px solid var(--border-mid);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .about-float-icon {
      width: 48px;
      height: 48px;
      background: rgba(227, 0, 16, 0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-red-light);
    }
    .about-float-text h4 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .about-float-text p {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .about-content h3 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .about-content > p {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.85;
      margin-bottom: 32px;
    }
    .about-features {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 36px;
    }
    .about-feature {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .about-feature-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: rgba(227, 0, 16, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-red-light);
    }
    .about-feature h4 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .about-feature p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* About 内的核心团队子区块 */
    .about-team-sub {
      margin-top: 96px;
      padding-top: 80px;
      border-top: 1px solid var(--border-soft);
    }
    .about-team-sub .section-header {
      margin-bottom: 48px;
    }
    .about.section {
      padding-bottom: 160px;
    }

    /* ===== Channels ===== */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .channel-card {
      position: relative;
      background: var(--bg-elev-1);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 32px 28px;
      transition: all 0.35s var(--ease-out);
      cursor: pointer;
      overflow: hidden;
    }
    .channel-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--brand-red);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s var(--ease-out);
    }
    .channel-card:hover {
      transform: translateY(-6px);
      border-color: rgba(227, 0, 16, 0.35);
      background: var(--bg-elev-2);
      box-shadow: 0 20px 50px rgba(227, 0, 16, 0.12);
    }
    .channel-card:hover::before {
      transform: scaleX(1);
    }
    .channel-icon {
      width: 56px;
      height: 56px;
      background: rgba(227, 0, 16, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brand-red-light);
      margin-bottom: 24px;
      transition: all 0.35s var(--ease-out);
    }
    .channel-card:hover .channel-icon {
      background: var(--brand-red);
      color: #FFFFFF;
      transform: scale(1.05);
    }
    .channel-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .channel-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .channel-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--brand-red-light);
      transition: gap 0.25s var(--ease-out);
    }
    .channel-card:hover .channel-link {
      gap: 10px;
    }

    /* ===== Highlights ===== */
    .highlights {
      background: #000000;
      border-top: 1px solid var(--border-soft);
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-primary);
      overflow: hidden;
    }
    .highlights .section-title {
      color: var(--text-primary);
    }
    .highlights .section-desc {
      color: var(--text-secondary);
    }
    .highlights .section-tag {
      color: var(--brand-red-light);
    }
    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .highlight-card {
      position: relative;
      background: var(--bg-elev-2);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 36px 28px;
      transition: all 0.35s var(--ease-out);
      cursor: pointer;
    }
    .highlight-card:hover {
      background: #1a0507;
      border-color: rgba(227, 0, 16, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(227, 0, 16, 0.1);
    }
    .highlight-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(227, 0, 16, 0.15);
      color: var(--brand-red-light);
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .highlight-card h3 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.4;
      color: var(--text-primary);
    }
    .highlight-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .highlight-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .highlight-read {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--brand-red-light);
      font-weight: 600;
    }

    /* ===== Stats Banner ===== */
    .stats-banner {
      background: linear-gradient(135deg, var(--brand-red) 0%, var(--brand-red-dark) 100%);
      padding: 80px 0;
      position: relative;
      overflow: hidden;
    }
    .stats-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
    }
    .stats-row {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      text-align: center;
    }
    .stat-item {
      color: #FFFFFF;
    }
    .stat-num {
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .stat-label {
      font-size: 15px;
      opacity: 0.85;
      font-weight: 400;
    }

    /* ===== Team ===== */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .team-card {
      text-align: center;
      padding: 32px 20px;
      border-radius: 14px;
      transition: all 0.35s var(--ease-out);
      cursor: pointer;
      background: var(--bg-elev-1);
      border: 1px solid var(--border-soft);
    }
    .team-card:hover {
      transform: translateY(-6px);
      background: var(--bg-elev-2);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      border-color: rgba(227, 0, 16, 0.3);
    }
    .team-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(145deg, var(--brand-red), var(--brand-red-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 36px;
      font-weight: 700;
      position: relative;
      overflow: hidden;
    }
    .team-avatar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      right: -100px;

      height: 400px;

      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 20px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .footer-col a {
      font-size: 14px;
      color: var(--text-tertiary);

    }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 0;
      font-size: 13px;
      color: var(--text-muted);

    .footer-bottom-links {
      display: flex;
      gap: 24px;
    }
    .footer-bottom-links a:hover {
      color: var(--text-secondary);
    }

    /* ===== Scroll Reveal ===== */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== Back to top ===== */
    .back-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 48px;
      height: 48px;
      background: var(--brand-red);
      color: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s var(--ease-out);
      z-index: 99;
      box-shadow: 0 4px 16px var(--brand-red-glow);
    }
    .back-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .back-top:hover {
      background: var(--brand-red-light);
      transform: translateY(-3px);

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .hero-inner { grid-template-columns: 1fr; gap: 60px; text-align: center; }
      .hero-desc { margin: 0 auto 40px; }
      .hero-actions { justify-content: center; }
      .hero-stats { justify-content: center; }
      .hero-logo-wrap { width: 300px; height: 300px; margin: 0 auto; }
      .channels-grid { grid-template-columns: repeat(2, 1fr); }
      .highlights-grid { grid-template-columns: repeat(2, 1fr); }
      .team-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-row { grid-template-columns: repeat(2, 1fr); gap: 32px; }
      .about-grid { grid-template-columns: 1fr; gap: 60px; }
      .cta-card { grid-template-columns: 1fr; text-align: center; padding: 60px 40px; }
      .cta-actions { justify-content: center; }
      .cta-content p { margin-left: auto; margin-right: auto; }
      .footer-top { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .container { padding: 0 20px; }
      .section { padding: 80px 0; }
      .hero-title { font-size: 40px; }
      .section-title { font-size: 28px; }

      .hero-stats { flex-direction: column; gap: 24px; align-items: center; }
    }

        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

        e.preventDefault();
        const href = e.currentTarget.getAttribute('href');
        if (href && href.startsWith('#')) {
          const el = document.querySelector(href);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth' });
          }
        }
      };

        e.preventDefault();
        alert('感谢您的关注！订阅功能即将上线。');

    // ===== Back to Top =====
    function BackToTop() {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const onScroll = () => setVisible(window.scrollY > 400);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const scrollTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <button className={`back-top ${visible ? 'visible' : ''}`} onClick={scrollTop}>
          <Icon.ChevronUp size={20} />
        </button>
      );
    }

    // ===== Scroll Reveal =====
    function useScrollReveal() {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
        );

        const els = document.querySelectorAll('.reveal');
        els.forEach((el) => observer.observe(el));

        return () => observer.disconnect();
      }, []);
    }
